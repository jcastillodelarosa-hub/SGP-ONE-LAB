name: Picking manual PDT least privilege
on:
  pull_request:
    paths:
      - 'app.js'
      - 'src/domain/pdt-manual.js'
      - 'src/modules/pdt-manual-form.js'
      - 'tests/pdt-manual-picking*'
      - 'tests/pdt-manual-picking/**'
      - 'docs/sql-proposals/pdt/manual-picking/**'
      - '.github/workflows/pdt-manual-picking.yml'
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/pdt-manual*.test.mjs
      - run: npm install --prefix "$RUNNER_TEMP/picking-qa" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - run: PGLITE_MODULE="$RUNNER_TEMP/picking-qa/node_modules/@electric-sql/pglite/dist/index.js" node tests/pdt-manual-picking/run.mjs
      - run: python3 -m pip install playwright==1.56.0
      - run: SGP_QA_CHROMIUM=/usr/bin/google-chrome python3 tests/pdt-manual-picking/browser.py
