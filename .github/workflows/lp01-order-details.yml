name: Order details contracts (isolated)
on:
  pull_request:
    paths:
      - 'docs/sql-proposals/lp01-order-details/**'
      - 'tests/lp01-order-details/**'
      - 'tests/lp01-order-details.test.mjs'
      - 'tests/lp01-export-glass.test.mjs'
      - 'src/modules/lp01-*.js'
      - 'src/modules/lp01-followup.css'
      - 'src/services/lp01-*.js'
      - 'src/domain/lp01-export-glass.js'
      - 'src/domain/lp01-order-note-editor.js'
      - '.github/workflows/lp01-order-details.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/lp01-order-details.test.mjs tests/lp01-export-glass.test.mjs
      - run: docker pull postgres:17.11
      - run: python tests/lp01-order-details/postgres.py
      - run: python tests/lp01-order-details/admission.py
      - run: python tests/lp01-order-details/glass-nc.py
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/lp01-order-details/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-details-synthetic-contracts
          path: |
            tests/lp01-order-details/*result.json
            tests/lp01-order-details/evidence/
