name: PDT diagnostic - existing backup credential

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sgp-pdt-backup-credential-check
  cancel-in-progress: false

jobs:
  check:
    name: Check existing backup credential (read only)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: supabase-backup
    steps:
      - name: Check PostgreSQL login with existing backup password
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PGPASSWORD" || { echo "::error::Backup environment password unavailable"; exit 1; }
          docker run --rm -e PGPASSWORD -e PGSSLMODE=require -e PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=15000 -c lock_timeout=3000" postgres:17 psql -h aws-0-us-east-2.pooler.supabase.com -p 5432 -U postgres.ocvxbwzqxbrfndkvjmfx -d postgres -X -qAt -v ON_ERROR_STOP=1 -c "SHOW default_transaction_read_only" > /tmp/pdt-credential-check.out
          grep -qx on /tmp/pdt-credential-check.out
          echo "PDT_BACKUP_CREDENTIAL_CONNECTION_VERIFIED"
