name: PDT diagnostic - existing backup credential

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sgp-pdt-backup-credential-check
  cancel-in-progress: false

jobs:
  check:
    name: Check existing backup credential (read only)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: supabase-backup
    steps:
      - name: Classify PostgreSQL connection safely
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$PGPASSWORD" ]; then
            echo "::error::BACKUP_SECRET_MISSING"
            exit 1
          fi
          set +e
          docker run --rm -e PGPASSWORD -e PGSSLMODE=require -e PGCONNECT_TIMEOUT=12 -e PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=15000 -c lock_timeout=3000" postgres:17 psql -h aws-0-us-east-2.pooler.supabase.com -p 5432 -U postgres.ocvxbwzqxbrfndkvjmfx -d postgres -X -qAt -v ON_ERROR_STOP=1 -c "SELECT current_setting('transaction_read_only')" > /tmp/pdt-check.out 2> /tmp/pdt-check.err
          status=$?
          set -e
          if [ "$status" -eq 0 ] && grep -Eq "^(on|off)$" /tmp/pdt-check.out; then
            echo "PDT_BACKUP_CREDENTIAL_CONNECTION_VERIFIED"
            cat > /tmp/pdt-baseline.sql <<'SQL'
          BEGIN READ ONLY;
          SELECT CASE WHEN current_setting('transaction_read_only')='on' THEN 'READ_ONLY_CONNECTION_OK' ELSE 'READ_ONLY_CONNECTION_FAILED' END;
          SELECT CASE WHEN to_regclass('public.sgp_aluminio_pendientes') IS NOT NULL AND to_regclass('public.sgp_usuarios') IS NOT NULL AND to_regprocedure('public.sgp_login(text,text)') IS NOT NULL THEN 'PDT_BASELINE_PRESENT' ELSE 'PDT_BASELINE_MISSING' END;
          SELECT CASE WHEN to_regclass('sgp_pdt_manual.corte_operativo') IS NULL AND to_regprocedure('public.sgp_pdt_corte_operativo_v1(text)') IS NULL THEN 'PDT_CUTOVER_NOT_INSTALLED' ELSE 'PDT_CUTOVER_ALREADY_PRESENT' END;
          SELECT CASE WHEN has_function_privilege('anon','public.sgp_login(text,text)','EXECUTE') THEN 'PDT_LOGIN_GRANT_OK' ELSE 'PDT_LOGIN_GRANT_MISSING' END;
          ROLLBACK;
          SQL
            docker run --rm -i -e PGPASSWORD -e PGSSLMODE=require -e PGCONNECT_TIMEOUT=12 -e PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=15000 -c lock_timeout=3000" postgres:17 psql -h aws-0-us-east-2.pooler.supabase.com -p 5432 -U postgres.ocvxbwzqxbrfndkvjmfx -d postgres -X -qAt -v ON_ERROR_STOP=1 < /tmp/pdt-baseline.sql > /tmp/pdt-baseline.out 2> /tmp/pdt-baseline.err || { echo "::error::PDT_BASELINE_QUERY_FAILED"; exit 1; }
            cat /tmp/pdt-baseline.out
            grep -qx READ_ONLY_CONNECTION_OK /tmp/pdt-baseline.out
            grep -qx PDT_BASELINE_PRESENT /tmp/pdt-baseline.out
            grep -qx PDT_CUTOVER_NOT_INSTALLED /tmp/pdt-baseline.out
            grep -qx PDT_LOGIN_GRANT_OK /tmp/pdt-baseline.out
            echo "PDT_READ_ONLY_PREFLIGHT_PASS"
            exit 0
          fi
          if grep -qiE 'password authentication failed|invalid password|authentication failed' /tmp/pdt-check.err; then
            echo "::error::PDT_AUTHENTICATION_FAILED"
          elif grep -qiE 'could not translate host|name or service not known|temporary failure in name resolution' /tmp/pdt-check.err; then
            echo "::error::PDT_DNS_FAILED"
          elif grep -qiE 'timeout|refused|no route to host|network is unreachable' /tmp/pdt-check.err; then
            echo "::error::PDT_NETWORK_FAILED"
          elif grep -qiE 'SSL|certificate' /tmp/pdt-check.err; then
            echo "::error::PDT_TLS_FAILED"
          elif [ "$status" -eq 0 ]; then
            echo "::error::PDT_QUERY_RESULT_UNEXPECTED"
          else
            echo "::error::PDT_CONNECTION_OTHER_FAILURE"
          fi
          exit 1
