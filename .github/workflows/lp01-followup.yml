name: LP01 followup - isolated UI acceptance
on:
  pull_request:
    paths:
      - 'src/domain/lp01-*.js'
      - 'src/domain/powerbi/**'
      - 'src/server/lp-powerbi-handler.js'
      - 'src/modules/lp01-powerbi-client.js'
      - 'supabase/**'
      - 'package.json'
      - 'tests/lp01-powerbi/**'
      - 'tests/lp01-powerbi.test.mjs'
      - 'src/modules/lp01-operation.js'
      - 'docs/sql-proposals/lp01-operacion/**'
      - 'tests/lp01-operacion/**'
      - 'tests/lp01-operation.test.mjs'
      - 'tests/lp01-continuidad/**'
      - 'tests/lp01-continuidad.test.mjs'
      - 'tests/lp01-sin-actividad/**'
      - 'tests/lp01-sin-actividad.test.mjs'
      - 'tests/lp01-apertura/**'
      - 'tests/lp01-apertura.test.mjs'
      - 'tests/lp01-cierres-integrados/**'
      - 'tests/lp01-paneles2/**'
      - 'tests/lp01-roles/**'
      - 'tests/lp01-seguimiento-incremento/**'
      - 'tests/lp01-tracking-global.test.mjs'
      - 'tests/lp01-tracking-ui/**'
      - 'tests/lp01-summary-ui/**'
      - 'tests/lp01-pending-ui/**'
      - 'tests/lp01-afectaciones-rpc/**'
      - 'tests/lp01-affectations*.test.mjs'
      - 'tests/lp01-b12-b13/**'
      - 'tests/lp01-operation-orders.test.mjs'
      - 'src/modules/lp01-operation-orders.js'
      - 'src/modules/lp01-proposal.js'
      - 'src/services/lp01-operation-evidence.js'
      - 'docs/sql-proposals/lp01-propuestas/**'
      - 'docs/sql-proposals/lp01-afectaciones/**'
      - 'src/modules/lp01-affectations-panel.js'
      - 'src/services/lp01-affectations.js'
      - 'src/modules/lp01-tracking.js'
      - 'docs/sql-proposals/lp01-seguimiento/**'
      - 'tests/lp01-ambitos-import/**'
      - 'tests/lp01-ambitos-import.test.mjs'
      - 'scripts/lp01-import-scopes.mjs'
      - 'src/server/lp01-scope-import.js'
      - 'tests/lp01-ambitos-temporales/**'
      - 'tests/lp01-ambitos/**'
      - 'tests/lp01-ambitos.test.mjs'
      - 'scripts/lp01-review-scopes.mjs'
      - 'tests/lp01-export-reader/**'
      - 'tests/lp01-export-reader.test.mjs'
      - 'src/server/lp01-export-reader.js'
      - 'src/server/lp01-scope-review.js'
      - 'tests/lp01-origen/**'
      - 'tests/lp01-origen.test.mjs'
      - 'src/server/lp01-pdt-origin.js'
      - 'src/server/lp01-export-reconciliation.js'
      - 'tests/lp01-liberaciones/**'
      - 'tests/lp01-fuentes/**'
      - 'tests/lp01-fuentes.test.mjs'
      - 'src/server/lp01-opening-preparation.js'
      - 'scripts/lp01-opening-prepare.mjs'
      - 'app.js'
      - 'src/modules/lp01-followup.*'
      - 'production-line-tabs.js'
      - 'tests/lp01-followup.test.mjs'
      - 'tests/lp01-seguimiento/**'
      - '.github/workflows/lp01-followup.yml'
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    # Keep the full SQL and PC/mobile acceptance within a bounded 45-minute job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Compatibility evidence compares SQL10 with the pinned pre-review commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build:vendor
      - run: npm run verify:release
      - name: Focused regressions
        run: |
          node tests/lp01-powerbi.test.mjs
          node tests/lp01-operation.test.mjs
          node tests/lp01-tracking-global.test.mjs
          node tests/lp01-continuidad.test.mjs
          node tests/lp01-sin-actividad.test.mjs
          node tests/lp01-apertura.test.mjs
          node tests/lp01-fuentes.test.mjs
          node tests/lp01-origen.test.mjs
          node tests/lp01-export-reader.test.mjs
          node tests/lp01-ambitos.test.mjs
          node tests/lp01-ambitos/private-artifact.mjs
          node tests/lp01-ambitos-import.test.mjs
          node tests/lp01-ambitos-import/privacy.mjs
          node tests/lp01-ambitos-import/demo.mjs
          node tests/lp01-followup.test.mjs
          node tests/production-line-tabs.test.mjs
          node tests/planner-integration.test.mjs
          node tests/linea-produccion-v328.test.mjs
      - name: Isolated PostgreSQL contracts
        run: |
          python tests/lp01-operacion/postgres.py
          python tests/lp01-powerbi/postgres.py
          python tests/lp01-continuidad/postgres.py
          python tests/lp01-continuidad/xlsx-admission.py
          python tests/lp01-sin-actividad/postgres.py
          python tests/lp01-apertura/postgres.py
          python tests/lp01-fuentes/postgres.py
          python tests/lp01-liberaciones/postgres.py
          python tests/lp01-origen/postgres.py
          python tests/lp01-export-reader/postgres.py
          python tests/lp01-ambitos/postgres.py
          python tests/lp01-ambitos-temporales/postgres.py
          python tests/lp01-ambitos-import/postgres.py
          python tests/lp01-cierres-integrados/isolated.py
          python tests/lp01-roles/hardening.py
          python tests/lp01-roles/compatibility.py
          python tests/lp01-roles/postgres.py
          python tests/lp01-roles/activation.py
          python tests/lp01-roles/xlsx.py
      # Manual execution/start-turn UI was replaced by official imports and server opening.
      # Its current UI/SQL integration runs in lp01-operation-official.yml; native SQL regressions above remain.
      - name: Remaining native UI and historical acceptance
        run: |
          pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python tests/lp01-roles/browser.py
          python tests/lp01-sin-actividad/browser.py
          python tests/lp01-fuentes/browser.py
          python tests/lp01-seguimiento/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp01-followup-synthetic-evidence
          # Explicit synthetic results only; no historical metadata or receipts.
          path: |
            tests/lp01-seguimiento/evidence/browser-results.json
            tests/lp01-operacion/evidence/browser.json
            tests/lp01-operacion/evidence/postgres.json
            tests/lp01-powerbi/evidence/browser.json
            tests/lp01-powerbi/evidence/postgres.json
            tests/lp01-continuidad/evidence/browser.json
            tests/lp01-continuidad/evidence/postgres.json
            tests/lp01-sin-actividad/evidence/browser.json
            tests/lp01-sin-actividad/evidence/postgres.json
            tests/lp01-apertura/evidence/browser.json
            tests/lp01-apertura/evidence/postgres.json
            tests/lp01-fuentes/evidence/browser.json
            tests/lp01-fuentes/evidence/postgres.json
            tests/lp01-roles/evidence/browser.json
            tests/lp01-roles/evidence/postgres.json
            tests/lp01-liberaciones/evidence/postgres.json
            tests/lp01-origen/evidence/postgres.json
            tests/lp01-export-reader/evidence/postgres.json
            tests/lp01-ambitos/evidence/postgres.json
            tests/lp01-ambitos-temporales/evidence/postgres.json
            tests/lp01-ambitos-import/evidence/postgres.json
            tests/lp01-roles/evidence/hardening.json
            tests/lp01-roles/evidence/compatibility.json
            tests/lp01-roles/evidence/activation.json
            tests/lp01-roles/evidence/xlsx.json
            tests/lp01-cierres-integrados/evidence/browser-sql08.json

  tracking-global:
    name: Global tracking install, API permissions and UI (isolated)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build:vendor
      - run: docker pull postgres:17.11
      - run: docker pull postgrest/postgrest:v13.0.7@sha256:0a46780309a604cdc8b56c776c6e5e15788ce58174d709e40459ab5a2d44d228
      - name: Verify deterministic review package and minimal API permissions
        run: |
          python tests/lp01-seguimiento-incremento/build-package.py
          git diff --exit-code -- docs/sql-proposals/lp01-seguimiento
          python tests/lp01-seguimiento-incremento/check.py
          python tests/lp01-seguimiento-incremento/api.py
      - name: Global UI with the candidate API permissions
        run: |
          pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python tests/lp01-seguimiento-incremento/browser.py
          python tests/lp01-tracking-ui/browser.py
          python tests/lp01-summary-ui/browser.py
          python tests/lp01-pending-ui/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp01-global-tracking-synthetic-evidence
          path: |
            tests/lp01-seguimiento-incremento/result.json
            tests/lp01-seguimiento-incremento/api-result.json
            tests/lp01-seguimiento-incremento/browser-result.json
            tests/lp01-tracking-ui/evidence/
            tests/lp01-summary-ui/result.json
            tests/lp01-summary-ui/evidence/

  affectations:
    name: Affectations native PDT, revocation and UI (isolated)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build:vendor
      - run: docker pull postgres:17.11
      - name: Remove prior synthetic evidence before this run
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          root = Path('tests/lp01-afectaciones-rpc')
          for path in root.glob('*result.json'):
              path.unlink()
          for path in (root / 'evidence').glob('*.png'):
              path.unlink()
          PYTHON
      - name: Native contracts and temporal authorization after waits
        run: |
          python tests/lp01-afectaciones-rpc/current_chain.py
          python tests/lp01-afectaciones-rpc/chain_guards.py
          python tests/lp01-afectaciones-rpc/activation.py
          python tests/lp01-afectaciones-rpc/optional_nc.py
          python tests/lp01-afectaciones-rpc/atomic.py
          python tests/lp01-afectaciones-rpc/revocation.py
      - name: Synthetic native panel and existing app controllers
        run: |
          pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python tests/lp01-afectaciones-rpc/native-browser.py
          python tests/lp01-afectaciones-rpc/native-app.py
          python tests/lp01-afectaciones-rpc/unassigned-app.py
          python tests/lp01-afectaciones-rpc/all-origins.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp01-affectations-synthetic-evidence
          path: |
            tests/lp01-afectaciones-rpc/*result.json
            tests/lp01-afectaciones-rpc/evidence/

  operation-b12-b13:
    name: B12 B13 grouping, disabled proposal and volume (isolated)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build:vendor
      - run: docker pull postgres:17.11
      - run: pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: Remove previous synthetic results
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          root=Path('tests/lp01-b12-b13')
          for path in root.glob('*result.json'):path.unlink()
          for path in (root/'evidence').glob('*.png'):path.unlink()
          PYTHON
      - name: Contracts, real application and representative volume
        run: |
          node --test tests/lp01-operation-orders.test.mjs
          python tests/lp01-b12-b13/proposal.py
          node --test tests/lp01-official-panel.test.mjs
          node tests/lp01-b12-b13/performance.mjs
          python tests/lp01-b12-b13/dom-performance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lp01-b12-b13-synthetic-evidence
          path: |
            tests/lp01-b12-b13/*result.json
            tests/lp01-b12-b13/evidence/
