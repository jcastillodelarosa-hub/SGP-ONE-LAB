name: PDT unified - controlled production release

on:
  pull_request:
    paths:
      - '.github/workflows/pdt-unified-production-release.yml'
      - 'tests/pdt-release/**'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Run preflight first; publish requires separately verified backup'
        type: choice
        required: true
        options: [preflight, publish]
      backup_evidence:
        description: 'Verified private backup/recovery run URL (mandatory for publish)'
        required: false
        type: string
      backup_object:
        description: 'Private backup object identity, independently verified by release approver'
        required: false
        type: string
      backup_sha256:
        description: 'Verified SHA-256 of restored backup'
        required: false
        type: string
      recovery_generation:
        description: 'GCS immutable generation of recovery-verified.json'
        required: false
        type: string
      recovery_bytes:
        description: 'Size of recovery-verified.json'
        required: false
        type: string
      recovery_sha256:
        description: 'SHA-256 of recovery-verified.json'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: sgp-pdt-unified-production-release
  cancel-in-progress: false

jobs:
  candidate-check:
    name: PDT release / isolated static checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile release validation scripts without database access
        run: |
          python3 -m py_compile tests/pdt-backup/gcs_storage.py tests/pdt-release/live_preflight.py tests/pdt-release/verify_recovery.py tests/pdt-release/compare_live_catalog.py tests/pdt-release/prepare_cutover.py tests/pdt-release/post_release.py tests/pdt-release/artifact_digest.py tests/pdt-release/validate_connection.py
          python3 -m unittest discover -s tests/pdt-release -p 'test_*.py'
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/pdt-unified-production-release.yml').read_text()
          assert 'BACKUP_OBJECT: ${{ inputs.backup_object }}' in workflow
          assert 'Production release interlock — protected approval required' in workflow
          assert 'PDT_PUBLISH_ENABLED' in workflow
          print('PDT_RELEASE_STATIC_GUARDS_PASS')
          PY
  release:
    name: PDT unified / ${{ inputs.operation }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.operation == 'preflight' && 'supabase-backup' || 'pdt-unified-production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate candidate, authorization inputs and evidence
        env:
          OPERATION: ${{ inputs.operation }}
          BACKUP_EVIDENCE: ${{ inputs.backup_evidence }}
          BACKUP_OBJECT: ${{ inputs.backup_object }}
          BACKUP_SHA256: ${{ inputs.backup_sha256 }}
          RECOVERY_GENERATION: ${{ inputs.recovery_generation }}
          RECOVERY_BYTES: ${{ inputs.recovery_bytes }}
          RECOVERY_SHA256: ${{ inputs.recovery_sha256 }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess,sys
          op=os.environ['OPERATION']
          base='f830dd48459146d6d2dfeb9173ecd9824c1c93c4'
          assert subprocess.check_output(['git','merge-base',base,'HEAD'],text=True).strip()==base, 'Unapproved candidate ancestry'
          paths=['docs/sql-proposals/pdt/grouped-source/01_grouped_sources_REVIEW.sql',
            *[f'docs/sql-proposals/pdt/manual/{x}' for x in
              ['01_manual_phase1_REVIEW.sql','02_manual_validation_REVIEW.sql','03_manual_operations_REVIEW.sql','04_programacion_vigente_REVIEW.sql','05_export_year_REVIEW.sql']],
            'docs/sql-proposals/pdt/integration/06_operational_cutover_REVIEW.sql']
          for p in paths:
            assert subprocess.check_output(['git','show',f'{base}:{p}'])==open(p,'rb').read(),f'SQL changed: {p}'
          if op=='publish':
            assert re.fullmatch(r'https://github\.com/[^/]+/[^/]+/actions/runs/[0-9]+',os.environ['BACKUP_EVIDENCE']), 'Backup/recovery evidence URL required'
            assert re.fullmatch(r'gs://[A-Za-z0-9._-]+/[A-Za-z0-9._/-]+',os.environ['BACKUP_OBJECT']), 'Private GCS backup object required (provide exact gs://bucket/object from verified recovery evidence)'
            assert re.fullmatch(r'[0-9a-fA-F]{64}',os.environ['BACKUP_SHA256']), 'Verified backup SHA-256 required'
            for field in ('RECOVERY_GENERATION','RECOVERY_BYTES'):
              assert re.fullmatch(r'[1-9][0-9]*',os.environ[field]), f'{field} required: positive integer from immutable recovery record'
            assert re.fullmatch(r'[0-9a-fA-F]{64}',os.environ['RECOVERY_SHA256']), 'RECOVERY_SHA256 required: immutable recovery record digest'
          print('Candidate SQL pinned; inputs structurally valid')
          PY
      - name: Build and test before any production writes
        run: |
          # This repository has no package-lock.json; install exact versions from package.json.
          npm install --no-package-lock --no-audit --no-fund
          npm run build:vendor
          npm run verify:release
          npm test
          echo "SITE_SHA256=$(python3 tests/pdt-release/artifact_digest.py)" >> "$GITHUB_ENV"
      - name: Prepare read-only connection using validated backup credential
        if: inputs.operation == 'preflight'
        env:
          BACKUP_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse
          password=os.environ.get('BACKUP_DB_PASSWORD','')
          if not password:
              raise SystemExit('::error::SUPABASE_DB_PASSWORD missing in supabase-backup environment')
          user='postgres.ocvxbwzqxbrfndkvjmfx'
          url='postgresql://'+user+':'+urllib.parse.quote(password,safe='')+'@aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require'
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('DATABASE_URL='+url+chr(10))
          print('Read-only preflight connection configured from existing protected backup credential')
          PY
      - name: Prepare production connection for separately authorized publish
        if: inputs.operation == 'publish'
        env:
          PDT_DATABASE_URL: ${{ secrets.SGP_PDT_DATABASE_URL }}
        run: |
          python3 tests/pdt-release/validate_connection.py
          echo "::add-mask::$PDT_DATABASE_URL"
          echo "DATABASE_URL=$PDT_DATABASE_URL" >> "$GITHUB_ENV"
      - name: Validate live baseline without writes
        run: python3 tests/pdt-release/live_preflight.py
      - name: Stop after preflight
        if: inputs.operation == 'preflight'
        run: echo 'Read-only preflight complete. No deployment performed.'
      - name: Verify backup run conclusion with GitHub API
        if: inputs.operation == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_EVIDENCE: ${{ inputs.backup_evidence }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          run_id=os.environ['BACKUP_EVIDENCE'].rsplit('/',1)[-1]
          url=f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          data=json.load(urllib.request.urlopen(req))
          assert data['conclusion']=='success', 'Backup/recovery run not successful'
          assert data['event']=='workflow_dispatch', 'Evidence must be a manual run'
          assert data['repository']['full_name'].lower()==os.environ['GITHUB_REPOSITORY'].lower(), 'Backup evidence belongs to another repository'
          assert data['head_branch'] in ('feat/issue-144-pdt-isolated-validation','feat/pdt-unified-release-workflow','feat/pdt-multifabricacion-avances-nc'), 'Unexpected backup source'
          jobs_req=urllib.request.Request(data['jobs_url']+'?per_page=100',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          jobs=json.load(urllib.request.urlopen(jobs_req))['jobs']
          allowed_proof_jobs = {
            'feat/issue-144-pdt-isolated-validation': ('PDT unified - verified private recovery only',),
            'feat/pdt-unified-release-workflow': ('PDT unified - verified private recovery only',),
            'feat/pdt-multifabricacion-avances-nc': ('Supabase - private PostgreSQL backup and isolated recovery',),
          }
          proof=next((j for j in jobs if j['name'] in allowed_proof_jobs[data['head_branch']] and j['conclusion']=='success'),None)
          assert proof and proof['started_at'] and proof['completed_at'], 'Verified isolated recovery job missing or failed'
          with open(os.environ['GITHUB_ENV'],'a') as out:
            out.write('BACKUP_RUN_START='+proof['started_at']+'\n')
            out.write('BACKUP_RUN_END='+proof['completed_at']+'\n')
          from datetime import datetime,timezone,timedelta
          created=datetime.fromisoformat(data['created_at'].replace('Z','+00:00'))
          assert timedelta(0)<=datetime.now(timezone.utc)-created<=timedelta(hours=6), 'Recovery workflow run is stale'
          print('Successful run exists; operator must additionally verify backup freshness and recovery in environment approval.')
          PY
      - name: Authenticate to private GCS backup storage
        if: inputs.operation == 'publish'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGP_ONE_LAB }}
      - name: Install Google Cloud SDK
        if: inputs.operation == 'publish'
        uses: google-github-actions/setup-gcloud@v3
      - name: Verify isolated restoration evidence and freshness
        if: inputs.operation == 'publish'
        env:
          BACKUP_OBJECT: ${{ inputs.backup_object }}
          BACKUP_SHA256: ${{ inputs.backup_sha256 }}
          RECOVERY_GENERATION: ${{ inputs.recovery_generation }}
          RECOVERY_BYTES: ${{ inputs.recovery_bytes }}
          RECOVERY_SHA256: ${{ inputs.recovery_sha256 }}
        run: python3 tests/pdt-release/verify_recovery.py
      - name: Compare live RPC, RLS, grants and dependencies with verified snapshot
        if: inputs.operation == 'publish'
        run: python3 tests/pdt-release/compare_live_catalog.py
      - name: Production release interlock — protected approval required
        if: inputs.operation == 'publish'
        env:
          PUBLISH_ENABLED: ${{ vars.PDT_PUBLISH_ENABLED }}
        run: |
          test "$PUBLISH_ENABLED" = 'true' || { echo '::error::PDT_PUBLISH_ENABLED must be set in the protected production environment after review'; exit 1; }
          echo 'Protected publication gate satisfied; proceeding with pinned SQL only.'
      - name: Install pinned SQL phases
        if: inputs.operation == 'publish'
        env:
          DATABASE_URL: ${{ secrets.SGP_PDT_DATABASE_URL }}
        run: |
          set -euo pipefail
          files=(
            docs/sql-proposals/pdt/grouped-source/01_grouped_sources_REVIEW.sql
            docs/sql-proposals/pdt/manual/01_manual_phase1_REVIEW.sql
            docs/sql-proposals/pdt/manual/02_manual_validation_REVIEW.sql
            docs/sql-proposals/pdt/manual/03_manual_operations_REVIEW.sql
            docs/sql-proposals/pdt/manual/04_programacion_vigente_REVIEW.sql
            docs/sql-proposals/pdt/manual/05_export_year_REVIEW.sql
            docs/sql-proposals/pdt/integration/06_operational_cutover_REVIEW.sql
          )
          for f in "${files[@]}"; do
            echo "Installing $f"
            docker run --rm -e DATABASE_URL -v "$PWD:/work:ro" -w /work postgres:17 sh -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$1"' sh "$f"
            echo "PDT_PHASE_PASS: $f" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Activate cutover at actual execution instant
        if: inputs.operation == 'publish'
        env:
          DATABASE_URL: ${{ secrets.SGP_PDT_DATABASE_URL }}
        run: |
          python3 tests/pdt-release/prepare_cutover.py
          docker run --rm -e DATABASE_URL -v /tmp/pdt-release/activate.sql:/activate.sql:ro postgres:17 sh -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f /activate.sql'
          echo 'Cutover uses the PostgreSQL clock at the INSERT; review the returned UTC value.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify frontend artifact still matches tested bytes
        if: inputs.operation == 'publish'
        run: python3 tests/pdt-release/artifact_digest.py "$SITE_SHA256"
      - name: Deploy Firebase Hosting
        if: inputs.operation == 'publish'
        id: firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGP_ONE_LAB }}
          projectId: sgp-one-lab
          channelId: live
      - name: Verify deployed workspace was not changed after tests
        if: inputs.operation == 'publish'
        run: python3 tests/pdt-release/artifact_digest.py "$SITE_SHA256"
      - name: Record exact commit and Firebase deployment
        if: inputs.operation == 'publish'
        env:
          DEPLOY_URL: ${{ steps.firebase.outputs.details_url }}
        run: |
          test -n "$DEPLOY_URL" || { echo '::error::Firebase deployment URL missing'; exit 1; }
          echo "PDT_RELEASE_COMMIT: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "FRONTEND_SHA256: $SITE_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "FIREBASE_DEPLOYMENT: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'Functional PC/mobile and real-role acceptance remain pending until separately evidenced.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify backend after deployment without writes
        if: inputs.operation == 'publish'
        env:
          DATABASE_URL: ${{ secrets.SGP_PDT_DATABASE_URL }}
        run: python3 tests/pdt-release/post_release.py
      - name: Coordinated recovery notice on release failure
        if: failure() && inputs.operation == 'publish'
        run: |
          echo 'PDT_RELEASE_FAILED: halt operations and inspect whether corte_operativo is active.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Before activation, review guarded reverse SQL in reverse phase order. After activation, preserve all later writes and perform a coordinated forward repair of Supabase/frontend; never restore the whole database automatically.' >> "$GITHUB_STEP_SUMMARY"
