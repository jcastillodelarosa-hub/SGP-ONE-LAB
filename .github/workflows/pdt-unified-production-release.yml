name: PDT unified - controlled production release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Run preflight first; publish requires separately verified backup'
        type: choice
        required: true
        options: [preflight, publish]
      backup_evidence:
        description: 'Verified private backup/recovery run URL (mandatory for publish)'
        required: false
        type: string
      publication_utc:
        description: 'Approved UTC cutover instant, ISO 8601 ending in Z (mandatory for publish)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sgp-pdt-unified-production-release
  cancel-in-progress: false

jobs:
  release:
    name: PDT unified / ${{ inputs.operation }}
    if: github.ref == 'refs/heads/feat/pdt-unified-release-workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: pdt-unified-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate candidate, authorization inputs and evidence
        env:
          OPERATION: ${{ inputs.operation }}
          BACKUP_EVIDENCE: ${{ inputs.backup_evidence }}
          PUBLICATION_UTC: ${{ inputs.publication_utc }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess,sys
          op=os.environ['OPERATION']
          base='f830dd48459146d6d2dfeb9173ecd9824c1c93c4'
          assert subprocess.check_output(['git','merge-base',base,'HEAD'],text=True).strip()==base, 'Unapproved candidate ancestry'
          paths=['docs/sql-proposals/pdt/grouped-source/01_grouped_sources_REVIEW.sql',
            *[f'docs/sql-proposals/pdt/manual/{x}' for x in
              ['01_manual_phase1_REVIEW.sql','02_manual_validation_REVIEW.sql','03_manual_operations_REVIEW.sql','04_programacion_vigente_REVIEW.sql','05_export_year_REVIEW.sql']],
            'docs/sql-proposals/pdt/integration/06_operational_cutover_REVIEW.sql']
          for p in paths:
            assert subprocess.check_output(['git','show',f'{base}:{p}'])==open(p,'rb').read(),f'SQL changed: {p}'
          if op=='publish':
            assert re.fullmatch(r'https://github\.com/[^/]+/[^/]+/actions/runs/[0-9]+',os.environ['BACKUP_EVIDENCE']), 'Backup/recovery evidence URL required'
            assert re.fullmatch(r'\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ',os.environ['PUBLICATION_UTC']), 'Explicit UTC cutover required'
          print('Candidate SQL pinned; inputs structurally valid')
          PY
      - name: Verify required database connection
        env:
          DATABASE_URL: ${{ secrets.SGP_PDT_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::SGP_PDT_DATABASE_URL missing"; exit 1; }
          docker run --rm -e DATABASE_URL postgres:17 bash -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "select current_database(),current_user,now()"'
      - name: Verify release baseline (read only)
        env:
          DATABASE_URL: ${{ secrets.SGP_PDT_DATABASE_URL }}
        run: |
          docker run --rm -e DATABASE_URL postgres:17 bash -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "select to_regclass(\x27sgp_pdt_manual.corte_operativo\x27)"'
      - name: Stop after preflight
        if: inputs.operation == 'preflight'
        run: echo 'Read-only preflight complete. No deployment performed.'
      - name: Verify backup run conclusion with GitHub API
        if: inputs.operation == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_EVIDENCE: ${{ inputs.backup_evidence }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          run_id=os.environ['BACKUP_EVIDENCE'].rsplit('/',1)[-1]
          url=f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          data=json.load(urllib.request.urlopen(req))
          assert data['conclusion']=='success', 'Backup/recovery run not successful'
          assert data['head_branch'] in ('feat/issue-144-pdt-isolated-validation','feat/pdt-unified-release-workflow'), 'Unexpected backup source'
          print('Successful run exists; operator must additionally verify backup freshness and recovery in environment approval.')
          PY
      - name: Install pinned SQL phases
        if: inputs.operation == 'publish'
        env:
          DATABASE_URL: ${{ secrets.SGP_PDT_DATABASE_URL }}
        run: |
          set -euo pipefail
          files=(
            docs/sql-proposals/pdt/grouped-source/01_grouped_sources_REVIEW.sql
            docs/sql-proposals/pdt/manual/01_manual_phase1_REVIEW.sql
            docs/sql-proposals/pdt/manual/02_manual_validation_REVIEW.sql
            docs/sql-proposals/pdt/manual/03_manual_operations_REVIEW.sql
            docs/sql-proposals/pdt/manual/04_programacion_vigente_REVIEW.sql
            docs/sql-proposals/pdt/manual/05_export_year_REVIEW.sql
            docs/sql-proposals/pdt/integration/06_operational_cutover_REVIEW.sql
          )
          for f in "${files[@]}"; do
            echo "Installing $f"
            docker run --rm -e DATABASE_URL -v "$PWD:/work:ro" -w /work postgres:17 sh -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$1"' sh "$f"
          done
      - name: Activate explicit cutover
        if: inputs.operation == 'publish'
        env:
          DATABASE_URL: ${{ secrets.SGP_PDT_DATABASE_URL }}
          PUBLICATION_UTC: ${{ inputs.publication_utc }}
        run: |
          python3 - <<'PY'
          import os
          sql=open('docs/sql-proposals/pdt/integration/06_ACTIVAR_REVIEW.sql').read()
          sql=sql.replace('REPLACE_WITH_PUBLICATION_UTC',os.environ['PUBLICATION_UTC']).replace('REPLACE_WITH_ADMIN_USER','Jcastillo')
          open('/tmp/pdt-activate.sql','w').write(sql)
          PY
          docker run --rm -e DATABASE_URL -v /tmp/pdt-activate.sql:/activate.sql:ro postgres:17 sh -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f /activate.sql'
      - name: Build and test release
        if: inputs.operation == 'publish'
        run: |
          npm ci --no-audit --no-fund
          npm run build:vendor
          npm run verify:release
          npm test
      - name: Deploy Firebase Hosting
        if: inputs.operation == 'publish'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGP_ONE_LAB }}
          projectId: sgp-one-lab
          channelId: live
