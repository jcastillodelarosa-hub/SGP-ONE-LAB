name: PDT unified - controlled production release

on:
  pull_request:
    paths:
      - '.github/workflows/pdt-unified-production-release.yml'
      - 'tests/pdt-release/**'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Run preflight first; publish requires separately verified backup'
        type: choice
        required: true
        options: [preflight, publish]
      backup_evidence:
        description: 'Verified private backup/recovery run URL (mandatory for publish)'
        required: false
        type: string
      backup_object:
        description: 'Private backup object identity, independently verified by release approver'
        required: false
        type: string
      backup_sha256:
        description: 'Verified SHA-256 of restored backup'
        required: false
        type: string
      recovery_generation:
        description: 'GCS immutable generation of recovery-verified.json'
        required: false
        type: string
      recovery_bytes:
        description: 'Size of recovery-verified.json'
        required: false
        type: string
      recovery_sha256:
        description: 'SHA-256 of recovery-verified.json'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: sgp-pdt-unified-production-release
  cancel-in-progress: false

jobs:
  candidate-check:
    name: PDT release / isolated static checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile release validation scripts without database access
        run: |
          python3 -m py_compile tests/pdt-release/live_preflight.py tests/pdt-release/verify_recovery.py
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/pdt-unified-production-release.yml').read_text()
          assert 'BACKUP_OBJECT: ${{ inputs.backup_object }}' in workflow
          assert 'Production release interlock — independent approval required' in workflow
          assert 'Publish disabled.' in workflow
          print('PDT_RELEASE_STATIC_GUARDS_PASS')
          PY
  release:
    name: PDT unified / ${{ inputs.operation }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.operation == 'preflight' && 'supabase-backup' || 'pdt-unified-production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate candidate, authorization inputs and evidence
        env:
          OPERATION: ${{ inputs.operation }}
          BACKUP_EVIDENCE: ${{ inputs.backup_evidence }}
          BACKUP_OBJECT: ${{ inputs.backup_object }}
          BACKUP_SHA256: ${{ inputs.backup_sha256 }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess,sys
          op=os.environ['OPERATION']
          base='f830dd48459146d6d2dfeb9173ecd9824c1c93c4'
          assert subprocess.check_output(['git','merge-base',base,'HEAD'],text=True).strip()==base, 'Unapproved candidate ancestry'
          paths=['docs/sql-proposals/pdt/grouped-source/01_grouped_sources_REVIEW.sql',
            *[f'docs/sql-proposals/pdt/manual/{x}' for x in
              ['01_manual_phase1_REVIEW.sql','02_manual_validation_REVIEW.sql','03_manual_operations_REVIEW.sql','04_programacion_vigente_REVIEW.sql','05_export_year_REVIEW.sql']],
            'docs/sql-proposals/pdt/integration/06_operational_cutover_REVIEW.sql']
          for p in paths:
            assert subprocess.check_output(['git','show',f'{base}:{p}'])==open(p,'rb').read(),f'SQL changed: {p}'
          if op=='publish':
            assert re.fullmatch(r'https://github\.com/[^/]+/[^/]+/actions/runs/[0-9]+',os.environ['BACKUP_EVIDENCE']), 'Backup/recovery evidence URL required'
            assert os.environ['BACKUP_OBJECT'].startswith('gs://'), 'Private GCS backup object required'
            assert re.fullmatch(r'[0-9a-fA-F]{64}',os.environ['BACKUP_SHA256']), 'Verified backup SHA-256 required'
          print('Candidate SQL pinned; inputs structurally valid')
          PY
      - name: Build and test before any production writes
        run: |
          # This repository has no package-lock.json; install exact versions from package.json.
          npm install --no-package-lock --no-audit --no-fund
          npm run build:vendor
          npm run verify:release
          npm test
      - name: Prepare read-only connection using validated backup credential
        if: inputs.operation == 'preflight'
        env:
          BACKUP_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse
          password=os.environ.get('BACKUP_DB_PASSWORD','')
          if not password:
              raise SystemExit('::error::SUPABASE_DB_PASSWORD missing in supabase-backup environment')
          user='postgres.ocvxbwzqxbrfndkvjmfx'
          url='postgresql://'+user+':'+urllib.parse.quote(password,safe='')+'@aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require'
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('DATABASE_URL='+url+'\\n')
          print('Read-only preflight connection configured from existing protected backup credential')
          PY
      - name: Verify required database connection
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL missing"; exit 1; }
          docker run --rm -e DATABASE_URL -e PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=15000 -c lock_timeout=3000" postgres:17 bash -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "select 1"'
      - name: Verify release baseline (read only)
        run: |
          docker run --rm -e DATABASE_URL -e PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=15000 -c lock_timeout=3000" postgres:17 bash -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "select 1"'
      - name: Validate live baseline without writes
        run: python3 tests/pdt-release/live_preflight.py
      - name: Stop after preflight
        if: inputs.operation == 'preflight'
        run: echo 'Read-only preflight complete. No deployment performed.'
      - name: Verify backup run conclusion with GitHub API
        if: inputs.operation == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_EVIDENCE: ${{ inputs.backup_evidence }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          run_id=os.environ['BACKUP_EVIDENCE'].rsplit('/',1)[-1]
          url=f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          data=json.load(urllib.request.urlopen(req))
          assert data['conclusion']=='success', 'Backup/recovery run not successful'
          assert data['event']=='workflow_dispatch', 'Evidence must be a manual run'
          assert data['repository']['full_name'].lower()==os.environ['GITHUB_REPOSITORY'].lower(), 'Backup evidence belongs to another repository'
          assert data['head_branch'] in ('feat/issue-144-pdt-isolated-validation','feat/pdt-unified-release-workflow'), 'Unexpected backup source'
          jobs_req=urllib.request.Request(data['jobs_url']+'?per_page=100',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          jobs=json.load(urllib.request.urlopen(jobs_req))['jobs']
          assert any(j['name']=='PDT unified - verified private recovery only' and j['conclusion']=='success' for j in jobs), 'Verified isolated recovery job missing or failed'
          from datetime import datetime,timezone,timedelta
          created=datetime.fromisoformat(data['created_at'].replace('Z','+00:00'))
          assert timedelta(0)<=datetime.now(timezone.utc)-created<=timedelta(hours=6), 'Recovery workflow run is stale'
          print('Successful run exists; operator must additionally verify backup freshness and recovery in environment approval.')
          PY
      - name: Authenticate to private GCS backup storage
        if: inputs.operation == 'publish'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGP_ONE_LAB }}
      - name: Install Google Cloud SDK
        if: inputs.operation == 'publish'
        uses: google-github-actions/setup-gcloud@v3
      - name: Verify actual private backup bytes and catalog
        if: inputs.operation == 'publish'
        env:
          BACKUP_OBJECT: ${{ inputs.backup_object }}
          BACKUP_SHA256: ${{ inputs.backup_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/pdt-release
          gcloud storage cp "$BACKUP_OBJECT" /tmp/pdt-release/backup.dump
          printf '%s  %s\n' "$BACKUP_SHA256" /tmp/pdt-release/backup.dump | sha256sum -c -
          docker run --rm -v /tmp/pdt-release:/backup:ro postgres:17 pg_restore --list /backup/backup.dump > /tmp/pdt-release/catalog.txt
          test -s /tmp/pdt-release/catalog.txt
          echo 'Backup bytes, SHA-256 and pg_restore catalog verified; restore proof still requires separate approval.'
      - name: Verify isolated restoration evidence and freshness
        if: inputs.operation == 'publish'
        env:
          BACKUP_OBJECT: ${{ inputs.backup_object }}
          BACKUP_SHA256: ${{ inputs.backup_sha256 }}
          RECOVERY_GENERATION: ${{ inputs.recovery_generation }}
          RECOVERY_BYTES: ${{ inputs.recovery_bytes }}
          RECOVERY_SHA256: ${{ inputs.recovery_sha256 }}
        run: python3 tests/pdt-release/verify_recovery.py
      - name: Live database preflight — fail closed
        if: inputs.operation == 'publish'
        env:
          DATABASE_URL: ${{ secrets.SGP_PDT_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm -e DATABASE_URL postgres:17 sh -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "select current_database(),current_user,now()"' > /tmp/pdt-release/preflight.txt
          test -s /tmp/pdt-release/preflight.txt
          python3 tests/pdt-release/live_preflight.py
      - name: Production release interlock — independent approval required
        if: inputs.operation == 'publish'
        run: |
          echo '::error::STOP: catalog verification is not a restored backup proof; production RPC fingerprints/RLS checks and post-cutover coordinated recovery still require independent validation. Publish disabled.'
          exit 1
      - name: Install pinned SQL phases
        if: inputs.operation == 'publish'
        env:
          DATABASE_URL: ${{ secrets.SGP_PDT_DATABASE_URL }}
        run: |
          set -euo pipefail
          files=(
            docs/sql-proposals/pdt/grouped-source/01_grouped_sources_REVIEW.sql
            docs/sql-proposals/pdt/manual/01_manual_phase1_REVIEW.sql
            docs/sql-proposals/pdt/manual/02_manual_validation_REVIEW.sql
            docs/sql-proposals/pdt/manual/03_manual_operations_REVIEW.sql
            docs/sql-proposals/pdt/manual/04_programacion_vigente_REVIEW.sql
            docs/sql-proposals/pdt/manual/05_export_year_REVIEW.sql
            docs/sql-proposals/pdt/integration/06_operational_cutover_REVIEW.sql
          )
          for f in "${files[@]}"; do
            echo "Installing $f"
            docker run --rm -e DATABASE_URL -v "$PWD:/work:ro" -w /work postgres:17 sh -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$1"' sh "$f"
          done
      - name: Activate cutover at actual execution instant
        if: inputs.operation == 'publish'
        env:
          DATABASE_URL: ${{ secrets.SGP_PDT_DATABASE_URL }}
        run: |
          python3 - <<'PY'
          from datetime import datetime,timezone
          sql=open('docs/sql-proposals/pdt/integration/06_ACTIVAR_REVIEW.sql').read()
          instant=datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          sql=sql.replace('REPLACE_WITH_PUBLICATION_UTC',instant).replace('REPLACE_WITH_ADMIN_USER','Jcastillo')
          open('/tmp/pdt-activate.sql','w').write(sql)
          print('Recorded cutover UTC:',instant)
          PY
          docker run --rm -e DATABASE_URL -v /tmp/pdt-activate.sql:/activate.sql:ro postgres:17 sh -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f /activate.sql'
      - name: Deploy Firebase Hosting
        if: inputs.operation == 'publish'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGP_ONE_LAB }}
          projectId: sgp-one-lab
          channelId: live
