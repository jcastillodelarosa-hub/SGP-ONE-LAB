name: Picking missing impact browser
on:
  pull_request:
    paths: ['src/domain/picking*', 'src/modules/picking*', 'picking-delivery-report.css', 'styles.css', 'index.html', 'tests/picking-impact-browser/**', 'tests/picking-impact-sql/**', 'tests/picking-impact*.mjs', 'tests/picking-audit-impact*.mjs', 'docs/sql-proposals/picking-impact/**', '.github/workflows/picking-impact-browser.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated synthetic SQL and DOM dependencies
        run: npm install --prefix /tmp/impact-qa --ignore-scripts --no-audit --no-fund jsdom@26.1.0 @electric-sql/pglite@0.3.14
      - name: Synthetic modal and SQL contracts
        env:
          JSDOM_MODULE: /tmp/impact-qa/node_modules/jsdom/lib/api.js
          PGLITE_MODULE: /tmp/impact-qa/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          node tests/picking-audit-impact-dom.mjs
          node tests/picking-impact-complement-dom.mjs
          for test in tests/picking-impact-sql/test-*.mjs; do node "$test"; done
      - run: python3 -m pip install playwright==1.56.0
      - name: Synthetic accepted-impact, permission, update and session-change flows
        env:
          SGP_CHROME_PATH: /usr/bin/google-chrome
        run: python3 tests/picking-impact-browser/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: picking-missing-impact-browser-${{ github.sha }}
          path: /tmp/sgp-picking-impact-browser
          retention-days: 7
  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sgp_impact_qa
          POSTGRES_PASSWORD: synthetic-only-not-production
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psycopg2-binary==2.9.10
      - name: Real two-session contention against a local synthetic service only
        env:
          SGP_SYNTHETIC_PG: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: sgp_impact_qa
          PGUSER: postgres
          PGPASSWORD: synthetic-only-not-production
        run: python tests/picking-impact-sql/postgres-concurrency.py
