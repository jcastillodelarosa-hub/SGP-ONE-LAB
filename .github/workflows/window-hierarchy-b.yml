name: SGP approved B window hierarchy
on:
  pull_request:
    paths:
      - 'styles.css'
      - 'src/modules/picking-audit.js'
      - 'tests/window-hierarchy-b/**'
      - 'tests/window-hierarchy-b.test.mjs'
      - '.github/workflows/window-hierarchy-b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/window-hierarchy-b.test.mjs
      - run: python3 -m pip install playwright==1.56.0
      - name: Desktop, tablet and mobile synthetic audit flow
        env:
          RECEPTION_CHROMIUM: /usr/bin/google-chrome
          SGP_VISUAL_OUTPUT: artifacts/window-hierarchy-b
        run: python3 tests/window-hierarchy-b/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-hierarchy-b-screenshots
          path: artifacts/window-hierarchy-b
          if-no-files-found: warn
