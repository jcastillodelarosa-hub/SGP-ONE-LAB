name: SmartTable library tests
on:
  pull_request:
    paths:
      - 'src/ui/smarttable/**'
      - '.github/workflows/smarttable-library-tests.yml'
  push:
    branches:
      - 'feature/smarttable-library-v1'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check src/ui/smarttable/smarttable-core.mjs
          node --check src/ui/smarttable/smarttable-element.mjs
          node --check src/ui/smarttable/smarttable-core.test.mjs
      - name: Run SmartTable tests
        run: node --test src/ui/smarttable/smarttable-core.test.mjs
