name: Ensamble sheet (isolated UI)
on:
  pull_request:
    paths:
      - 'src/modules/lp01-assembly*'
      - 'src/modules/lp01-export-close-editor.js'
      - 'src/modules/lp01-historical-turn.js'
      - 'src/services/lp01-historical-turn.js'
      - 'tests/lp01-historical-turn.test.mjs'
      - 'tests/lp01-historical-close.test.mjs'
      - 'src/modules/lp01-powerbi-client.js'
      - 'src/server/lp-powerbi*'
      - 'supabase/functions/lp-powerbi/index.ts'
      - 'src/domain/lp01-packing-plan.js'
      - 'tests/lp01-export-close-ui/**'
      - 'tests/lp01-export-close-editor.test.mjs'
      - 'tests/lp01-packing-plan-close.test.mjs'
      - 'src/modules/lp01-operation.js'
      - 'src/modules/lp01-order-note*'
      - 'src/domain/lp01-assembly*'
      - 'src/domain/lp01-closure-export*'
      - 'tests/lp01-assembly*'
      - 'tests/lp01-packing-sheet.test.mjs'
      - 'tests/lp01-assembly-workspace/**'
      - 'tests/fixtures/lp01-closure-export-v2.mjs'
      - 'tests/fixtures/lp01-closure-plan-v4-synthetic.json'
      - 'tests/lp01-closure-plan-v4.test.mjs'
      - 'docs/sql-proposals/lp01-export-dual/**'
      - 'docs/sql-proposals/lp01-empaque-inclusion/**'
      - 'docs/sql-proposals/lp01-turno-horario-empaque/**'
      - 'docs/sql-proposals/lp01-plan-writers/**'
      - 'tests/lp01-export-dual/**'
      - 'tests/lp01-export-plan-v4/bootstrap.mjs'
      - '.github/workflows/lp01-assembly-sheet.yml'
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --prefix tests/lp01-assembly-workspace --ignore-scripts --no-audit --no-fund
      - name: Synthetic DOM integration
        run: |
          export LP_DOM_PACKAGE="file://$GITHUB_WORKSPACE/tests/lp01-assembly-workspace/node_modules/linkedom/esm/index.js"
          node tests/lp01-export-close-ui/dom.mjs
          node --test tests/lp01-historical-close.test.mjs tests/lp01-historical-turn.test.mjs tests/lp01-export-close-editor.test.mjs tests/lp01-packing-plan-close.test.mjs tests/lp01-powerbi-command.test.mjs
          node tests/lp01-export-import-v2/guard.mjs
          node tests/lp01-export-close-v2/guard.mjs
          node tests/lp01-assembly-workspace/dom.mjs
          node tests/lp01-assembly-workspace/role-race-dom.mjs
          node tests/lp01-assembly-workspace/controller-dom.mjs
          node tests/lp01-assembly-workspace/packing-controller-dom.mjs
          node --test tests/lp01-packing-sheet.test.mjs
          node tests/lp01-assembly-workspace/compact-notes-dom.mjs
          node --test tests/lp01-assembly-reports.test.mjs tests/lp01-closure-plan-v4.test.mjs
      - run: npm install --prefix tests/lp01-export-close-ui --ignore-scripts --no-audit --no-fund
      - run: node tests/lp01-export-close-ui/gateway.mjs
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/lp01-assembly-workspace/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ensamble-sheet-isolated-ui
          path: |
            tests/lp01-assembly-workspace/*results.json
            tests/lp01-assembly-workspace/evidence/

  export-dual-full-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix tests/lp01-export-plan-v4 --ignore-scripts --no-audit --no-fund
      - name: Exact SQL install chain and real Empaque open/incorporate/import/close
        run: |
          node docs/sql-proposals/lp01-export-dual/assemble.mjs > /tmp/lp-export-dual-install.sql
          node tests/lp01-export-dual/flow.mjs --full-chain
          node tests/lp01-export-dual/flow.mjs --full-chain --prior-active
