name: JavaScript syntax check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check app.js syntax
        run: node --check --input-type=module < app.js
      - name: Check Supabase client syntax
        run: node --check --input-type=module < src/services/supabase-client.js
