name: Export review selection
on:
  pull_request:
    paths:
      - 'src/modules/export-review.js'
      - 'styles.css'
      - 'tests/export-review/**'
      - '.github/workflows/export-review.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/export-review.js'
      - 'styles.css'
      - 'tests/export-review/**'
      - '.github/workflows/export-review.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install playwright==1.56.0
      - name: PC and mobile selection with synthetic RPC, no external browser requests
        env:
          EXPORT_CHROMIUM: /usr/bin/google-chrome
          EXPORT_QA_OUT: ${{ runner.temp }}/export-review
        run: python3 tests/export-review/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-review-${{ github.sha }}
          path: ${{ runner.temp }}/export-review
          retention-days: 7
