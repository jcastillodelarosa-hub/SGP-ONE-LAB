name: Reception Picking detail
on:
  pull_request:
    paths:
      - 'app.js'
      - 'src/modules/picking-audit.js'
      - 'src/domain/pdt-registration.js'
      - 'tests/reception-picking-v436/**'
      - '.github/workflows/reception-picking-detail.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install playwright==1.56.0
      - name: Real frontend with synthetic RPC, PC and mobile
        env:
          RECEPTION_CHROMIUM: /usr/bin/google-chrome
        run: python3 tests/reception-picking-v436/browser.py
