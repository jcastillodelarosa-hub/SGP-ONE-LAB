name: Picking reception reports
on:
  pull_request:
    paths: ['src/domain/picking*', 'src/modules/picking*', 'index.html', 'app.js', 'styles.css', 'tests/picking-reception-report*', 'tests/picking-reception-report/**', '.github/workflows/picking-reception-report.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install playwright==1.56.0
      - name: Reception report with synthetic data, PC and mobile
        env:
          SGP_CHROME_PATH: /usr/bin/google-chrome
        run: python3 tests/picking-reception-report/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: picking-reception-report-browser-${{ github.sha }}
          path: /tmp/sgp-reception-report-browser
          retention-days: 7
