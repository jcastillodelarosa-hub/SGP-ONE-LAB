name: PDT direct picking
on:
  pull_request:
    paths:
      - 'src/modules/pdt-*.js'
      - 'src/services/pdt-picking-simple.js'
      - 'src/services/pdt-production-deliveries.js'
      - 'index.html'
      - 'tests/pdt-dashboard-tabs*'
      - 'app.js'
      - 'styles.css'
      - 'tests/pdt-production-queue-browser.py'
      - 'docs/sql-proposals/pdt/picking-simple/**'
      - 'tests/pdt-picking-simple*'
      - 'tests/pdt-picking-simple/**'
      - '.github/workflows/pdt-picking-simple.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/pdt-*.js'
      - 'src/services/pdt-picking-simple.js'
      - 'src/services/pdt-production-deliveries.js'
      - 'index.html'
      - 'tests/pdt-dashboard-tabs*'
      - 'app.js'
      - 'styles.css'
      - 'tests/pdt-production-queue-browser.py'
      - 'docs/sql-proposals/pdt/picking-simple/**'
      - 'tests/pdt-picking-simple*'
      - 'tests/pdt-picking-simple/**'
      - '.github/workflows/pdt-picking-simple.yml'
permissions:
  contents: read
jobs:
  browser-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install playwright==1.56.0
      - name: Check Python-decoded browser setup and real JavaScript bindings
        run: python3 tests/pdt-dashboard-tabs-script-check.py
      - name: Validation tabs, historical closure and loading failures, PC and mobile
        env:
          SGP_QA_CHROMIUM: /usr/bin/google-chrome
          SGP_QA_OUT: ${{ runner.temp }}/pdt-dashboard-tabs-browser
        run: python3 tests/pdt-dashboard-tabs-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdt-dashboard-tabs-browser-${{ github.sha }}
          path: ${{ runner.temp }}/pdt-dashboard-tabs-browser
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install playwright==1.56.0
      - name: PC and mobile, synthetic RPC and no production requests
        env:
          SGP_QA_CHROMIUM: /usr/bin/google-chrome
          SGP_QA_OUT: ${{ runner.temp }}/pdt-picking-simple-browser
        run: python3 tests/pdt-picking-simple-ui-browser.py
      - name: Production PDT groups, partial deliveries and query failures, PC and mobile
        env:
          SGP_QA_CHROMIUM: /usr/bin/google-chrome
          SGP_QA_OUT: ${{ runner.temp }}/pdt-production-queue-browser
        run: python3 tests/pdt-production-queue-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdt-picking-simple-browser-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pdt-picking-simple-browser
            ${{ runner.temp }}/pdt-production-queue-browser
          retention-days: 7
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolated PostgreSQL contracts and concurrency, synthetic rows only
        run: python3 tests/pdt-picking-simple/run-postgres.py
