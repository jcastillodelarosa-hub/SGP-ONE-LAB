name: Preview SGP ONE (manual, isolated)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'PDT branch: read-only connection or GCS inventory; original preview branch unchanged'
        type: choice
        default: connection
        options:
          - validate-pdt-unified
          - connection
          - pdt-identity-cohort
          - pdt-identity-permissions
          - gcs-readiness
          - restore-readiness
          - create-gcs-bucket
          - gcs-channel-check
          - backup-restore
          - restore-backup
          - install-production
          - production-smoke

permissions:
  contents: read

concurrency:
  group: firebase-hosting-preview-linea-produccion
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/feat/linea-produccion-ensamble-empaque-tabs'
    runs-on: ubuntu-latest
    environment: firebase-preview-linea-produccion
    steps:
      - name: Checkout authorized preview branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build browser SDK
        run: npm run build:vendor
      - name: Verify release assets
        run: npm run verify:release
      - name: Run tests
        run: npm test
      - name: Deploy isolated Firebase preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGP_ONE_LAB }}
          projectId: sgp-one-lab
          channelId: linea-produccion-pr32
          expires: 7d

  # Registered manual entry point; only the PDT branch runs this read-only job.
  # Existing preview remains restricted to its original branch above.
  supabase-backup-connectivity:
    name: Supabase backup - read-only connectivity
    if: github.ref == 'refs/heads/feat/pdt-multifabricacion-avances-nc' && inputs.operation == 'connection'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: supabase-backup
    permissions:
      contents: read
    steps:
      - name: Checkout authorized PDT branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtain official PostgreSQL 17 client
        run: docker pull postgres:17
      - name: Verify PostgreSQL authentication and TLS without writes
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python3 tests/pdt-backup/check_connection.py

  gcs-backup-readiness:
    name: GCS backup - existing resources read-only
    if: github.ref == 'refs/heads/feat/pdt-multifabricacion-avances-nc' && (inputs.operation == 'gcs-readiness' || inputs.operation == 'gcs-channel-check')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: supabase-backup
    permissions:
      contents: read
    steps:
      - name: Checkout authorized PDT branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate with the existing Firebase credential (no new key)
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGP_ONE_LAB }}
          create_credentials_file: true
          cleanup_credentials: true
      - name: Configure official Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
      - name: Inspect existing GCS buckets without changes
        if: inputs.operation == 'gcs-readiness'
        run: python3 tests/pdt-backup/gcs_readiness.py
      - name: Verify prefix-restricted backup channel with non-sensitive metadata
        if: inputs.operation == 'gcs-channel-check'
        run: python3 tests/pdt-backup/gcs_storage.py

  restore-image-readiness:
    name: Supabase restore image - isolated synthetic readiness
    if: github.ref == 'refs/heads/feat/pdt-multifabricacion-avances-nc' && inputs.operation == 'restore-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout authorized PDT branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull official Supabase PostgreSQL 17.11 restore image
        run: docker pull supabase/postgres:17.11.0.006
      - name: Verify isolated restore prerequisites without production data
        run: python3 tests/pdt-backup/prepare_restore_image.py

  create-private-backup-bucket:
    name: GCS - create owner-authorized private backup bucket
    if: github.ref == 'refs/heads/feat/pdt-multifabricacion-avances-nc' && inputs.operation == 'create-gcs-bucket'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: supabase-backup
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate with existing credential; no new key
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGP_ONE_LAB }}
          create_credentials_file: true
          cleanup_credentials: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Create and verify the specifically authorized private bucket
        run: python3 tests/pdt-backup/create_gcs_bucket.py

  private-backup-and-restore:
    name: Supabase - private PostgreSQL backup and isolated recovery
    if: github.ref == 'refs/heads/feat/pdt-multifabricacion-avances-nc' && (inputs.operation == 'backup-restore' || inputs.operation == 'restore-backup' || inputs.operation == 'install-production')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: supabase-backup
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate with existing credential; no new key
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGP_ONE_LAB }}
          create_credentials_file: true
          cleanup_credentials: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Pull official PostgreSQL 17.11 clients and isolated recovery engine
        run: docker pull supabase/postgres:17.11.0.006
      - name: Run selected backup, recovery or expressly authorized installation
        env:
          SGP_RESTORE_EXISTING: ${{ inputs.operation == 'restore-backup' && 'true' || 'false' }}
          SUPABASE_DB_PASSWORD: ${{ (inputs.operation == 'backup-restore' || inputs.operation == 'install-production') && secrets.SUPABASE_DB_PASSWORD || '' }}
          SGP_INSTALL_PRODUCTION: ${{ inputs.operation == 'install-production' && 'PDT91_AUTHORIZED_NOW' || '' }}
        run: python3 tests/pdt-backup/backup_and_restore.py

  production-smoke:
    name: PDT - live release verification without persistent QA data
    if: github.ref == 'refs/heads/feat/pdt-multifabricacion-avances-nc' && inputs.operation == 'production-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: supabase-backup
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtain PostgreSQL17 client and browser driver
        run: |
          docker pull postgres:17
          python3 -m pip install playwright==1.56.0
      - name: Verify real authentication transaction and deployed browser
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python3 tests/pdt-backup/production_smoke.py --browser-only

  pdt-source-case-read:
    name: PDT case source predicate comparison (read only)
    if: github.ref == 'refs/heads/fix/lab-v354-pdt-visibility' && (inputs.operation == 'connection' || inputs.operation == 'pdt-identity-cohort' || inputs.operation == 'pdt-identity-permissions')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: supabase-backup
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker pull postgres:17
      - name: Read only the observed pending, related PANEL sources and exact RPC definitions
        if: inputs.operation == 'connection'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python3 tests/pdt-backup/read_pdt_sources.py --identity-core
      - name: Read installed pending triggers and references
        if: inputs.operation == 'connection'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python3 tests/pdt-backup/read_pdt_sources.py --identity-guards
      - name: Read backup cohort counts and classifications without updating rows
        if: inputs.operation != 'pdt-identity-permissions'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python3 tests/pdt-backup/read_pdt_sources.py --identity-cohort

      - name: Read the existing novelty INSERT policies only
        if: inputs.operation == 'pdt-identity-permissions'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python3 tests/pdt-backup/read_pdt_sources.py --identity-permissions

  validate-pdt-unified:
    name: PDT unified - verified private recovery only
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/issue-144-pdt-isolated-validation' && inputs.operation == 'validate-pdt-unified'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: supabase-backup
    permissions:
      contents: read
    steps:
      - name: Checkout validation infrastructure
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout approved candidate at immutable SHA
        uses: actions/checkout@v4
        with:
          ref: f830dd48459146d6d2dfeb9173ecd9824c1c93c4
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolation and report security
        run: python3 -m unittest discover -s tests/pdt-unified -p 'test_*.py'
      - name: Verify candidate and release without cloud credentials
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = f830dd48459146d6d2dfeb9173ecd9824c1c93c4
          python3 -m unittest discover -s tests/pdt-manual -p 'test_*.py'
          npm install --no-audit --no-fund
          npm run build:vendor
          npm run verify:release
          node --test tests/pdt-manual.test.mjs tests/pdt-manual-validation.test.mjs tests/aluminum-pending-v2.test.mjs tests/pdt-grouped/grouped-sources.test.mjs
      - name: Pull isolated PostgreSQL 17.11 engine
        run: docker pull supabase/postgres:17.11.0.006
      - name: Authenticate existing GCS identity
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGP_ONE_LAB }}
          create_credentials_file: true
          cleanup_credentials: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Restore verified backup and validate inside networkless clone
        env:
          SGP_RESTORE_EXISTING: 'true'
          SGP_CANDIDATE_PATH: candidate
        run: python3 tests/pdt-backup/validate_pdt_unified.py
      - name: Publish sanitized validation summary only
        if: always()
        run: python3 tests/pdt-backup/validate_pdt_unified.py --summary
