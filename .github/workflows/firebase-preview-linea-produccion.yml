name: Preview SGP ONE (manual, isolated)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'PDT branch: read-only connection or GCS inventory; original preview branch unchanged'
        type: choice
        default: connection
        options:
          - connection
          - gcs-readiness
          - restore-readiness
          - create-gcs-bucket
          - gcs-channel-check

permissions:
  contents: read

concurrency:
  group: firebase-hosting-preview-linea-produccion
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/feat/linea-produccion-ensamble-empaque-tabs'
    runs-on: ubuntu-latest
    environment: firebase-preview-linea-produccion
    steps:
      - name: Checkout authorized preview branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build browser SDK
        run: npm run build:vendor
      - name: Verify release assets
        run: npm run verify:release
      - name: Run tests
        run: npm test
      - name: Deploy isolated Firebase preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGP_ONE_LAB }}
          projectId: sgp-one-lab
          channelId: linea-produccion-pr32
          expires: 7d

  # Registered manual entry point; only the PDT branch runs this read-only job.
  # Existing preview remains restricted to its original branch above.
  supabase-backup-connectivity:
    name: Supabase backup - read-only connectivity
    if: github.ref == 'refs/heads/feat/pdt-multifabricacion-avances-nc' && inputs.operation == 'connection'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: supabase-backup
    permissions:
      contents: read
    steps:
      - name: Checkout authorized PDT branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtain official PostgreSQL 17 client
        run: docker pull postgres:17
      - name: Verify PostgreSQL authentication and TLS without writes
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python3 tests/pdt-backup/check_connection.py

  gcs-backup-readiness:
    name: GCS backup - existing resources read-only
    if: github.ref == 'refs/heads/feat/pdt-multifabricacion-avances-nc' && (inputs.operation == 'gcs-readiness' || inputs.operation == 'gcs-channel-check')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: supabase-backup
    permissions:
      contents: read
    steps:
      - name: Checkout authorized PDT branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate with the existing Firebase credential (no new key)
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGP_ONE_LAB }}
          create_credentials_file: true
          cleanup_credentials: true
      - name: Configure official Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
      - name: Inspect existing GCS buckets without changes
        if: inputs.operation == 'gcs-readiness'
        run: python3 tests/pdt-backup/gcs_readiness.py
      - name: Verify prefix-restricted backup channel with non-sensitive metadata
        if: inputs.operation == 'gcs-channel-check'
        run: python3 tests/pdt-backup/gcs_storage.py

  restore-image-readiness:
    name: Supabase restore image - isolated synthetic readiness
    if: github.ref == 'refs/heads/feat/pdt-multifabricacion-avances-nc' && inputs.operation == 'restore-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout authorized PDT branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull official Supabase PostgreSQL 17.11 restore image
        run: docker pull supabase/postgres:17.11.0.006
      - name: Verify isolated restore prerequisites without production data
        run: python3 tests/pdt-backup/prepare_restore_image.py

  create-private-backup-bucket:
    name: GCS - create owner-authorized private backup bucket
    if: github.ref == 'refs/heads/feat/pdt-multifabricacion-avances-nc' && inputs.operation == 'create-gcs-bucket'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: supabase-backup
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate with existing credential; no new key
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGP_ONE_LAB }}
          create_credentials_file: true
          cleanup_credentials: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Create and verify the specifically authorized private bucket
        run: python3 tests/pdt-backup/create_gcs_bucket.py
