name: Deploy SGP ONE to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build local browser dependencies
        run: npm run build:vendor

      - name: Install Firebase Functions dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGP_ONE_LAB }}

      - name: Deploy Firebase Functions and Hosting
        run: npx firebase-tools@latest deploy --only functions,hosting --project sgp-one-lab --non-interactive
