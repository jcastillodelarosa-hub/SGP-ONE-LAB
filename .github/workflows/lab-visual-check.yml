name: LAB v356 visual verification (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser driver
        run: python3 -m pip install playwright==1.56.0
      - name: Verify deployed version and isolated PDT navigation using published assets
        env:
          SGP_CHROME_PATH: /usr/bin/google-chrome
        run: python3 tests/pdt-visibility-browser.py --production-url https://sgp-one-lab.web.app --expected-sha "$GITHUB_SHA"
