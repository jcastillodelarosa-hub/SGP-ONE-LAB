name: Vidrio B19/B21 (isolated UI)
on:
  pull_request:
    paths:
      - 'src/domain/glass-location-report.js'
      - 'src/domain/glass-preparation*'
      - 'src/modules/glass-preparation*'
      - 'tests/glass-location-report/**'
      - 'tests/glass-preparation*'
      - '.github/workflows/glass-views.yml'
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/glass-location-report.test.mjs tests/glass-week-filter-v306.test.mjs tests/glass-week-partial-mapping.test.mjs
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/glass-location-report/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vidrio-b19-ui
          path: /tmp/b19-*.png
