<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ensamble · fixture sintética</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/src/modules/lp01-followup.css"><link rel="stylesheet" href="/src/modules/lp01-assembly-sheet.css"><link rel="stylesheet" href="/src/modules/lp01-assembly-workspace.css"><link rel="stylesheet" href="/src/modules/lp01-assembly-reports.css"><style>body{display:block;margin:0;padding:16px;background:#f4f7fb}main{max-width:1440px;margin:auto}.qa-label{font:12px sans-serif;color:#586477}button{cursor:pointer}</style></head><body><main><p class="qa-label">QA sintética local. No sesión ni datos productivos.</p><section id="workspace" class="lp-followup"></section><section id="reports" hidden></section></main><div id="glassDetailModal" class="modal glass-detail-modal" hidden><div class="modal-card">
 <div class="modal-head"><div><span class="eyebrow">Ubicación de vidrio</span><h3 id="glassDetailTitle">Detalle</h3><p id="glassDetailMeta"></p></div><button id="closeGlassDetail">Cerrar</button></div>
 <div id="glassDetailSummary" class="glass-detail-summary"></div>
 <div id="glassDetailBody" class="glass-detail-body"></div>
</div></div><script type="module">
import {glassLocationDetailMarkup} from '/src/modules/glass-location-detail.js';
import {mountAssemblyWorkspace} from '/src/modules/lp01-assembly-workspace.js';
import {paintOrderNoteRows,retainOrderNoteRows} from '/src/modules/lp01-order-note-rows.js';
import {renderAssemblyReports} from '/src/modules/lp01-assembly-reports.js';
import {renderAssemblyClose} from '/src/modules/lp01-assembly-close.js';
import {closurePartialReloadFixture} from '/tests/fixtures/lp01-closure-export-v2.mjs';
const fixture=closurePartialReloadFixture();window.context=fixture.context;window.data=fixture.data;
const catalog=data.catalog.productions;catalog[0].oficial.produccion='A · Orden abierta de semana anterior';catalog[0].oficial.semana_base=43;
catalog[1].oficial.saldo_ensamble=20;catalog[1].oficial.produccion='B · Programada de este turno';catalog[1].assignments=[{id:'plan-b',key_produccion:catalog[1].key,fecha:context.date,turno:context.shift,cantidad:8,prioridad:1,source:'PROGRAMACION_LINEA'}];
const extra=structuredClone(catalog[1]);extra.key='C|PANELES_2';extra.oficial={...extra.oficial,key_produccion:extra.key,produccion:'C · Otra orden disponible',reserva_al:'R-C'};extra.assignments=[];catalog.push(extra);data.schedule={contract:'LP-HOJA-HORARIO-1',status:'AVAILABLE',currentPeriod:{date:context.date,shift:context.shift}};
window.noteStore=new Map();window.noteWrites=[];window.calls=[];window.token='synthetic';
const read=key=>{const note=noteStore.get(key)||{revision:0,observation:'Observación compartida de '+key,history:[]};return {contract:'LP-ORDER-DETAILS-1',key,line:context.line,stage:context.stage,note:{revision:note.revision,observation:note.observation},history:note.history,capabilities:['READ','NOTE'],export:{quantity:'20',percentage:'0',present:true}};};
const bridge={getToken:()=>token,getClient:async()=>({rpc:async(name,args)=>{calls.push(name);if(name==='sgp_lp_order_details_read_v1')return {data:read(args.p_key),error:null};if(name==='sgp_lp_order_note_save_v1'){const c=args.p_cmd;noteWrites.push(structuredClone(c));const before=read(args.p_key);const revision=c.revision+1;noteStore.set(args.p_key,{revision,observation:c.observation,history:[...before.history,{id:c.id,revision,observation:c.observation,stage:context.stage}]});return {data:{contract:'LP-ORDER-NOTE-SAVED-1',key:args.p_key,id:c.id,revision,observation:c.observation,duplicate:false},error:null};}return {data:null,error:{code:'PGRST202',message:'Fuente independiente no disponible en fixture'}};}})};
const host=document.querySelector('#workspace'),reports=document.querySelector('#reports');
const glassModal=document.querySelector('#glassDetailModal');
const showGlass=()=>{
 const source={produccion:{produccion:'QA vidrio',orden_oves:'OVES-QA-1',tipo_vidrio:'LAMINADO',sistema:'ES100',cantidad:2},unidades:3,burros:1,detalle:[{categoria:'PREPARADO',posicion:'BURRO-QA',unidades:3,estado:'Preparado',piezas:[{unidades:2,dimensiones:'100 × 200',marca:'MARCA-QA-A'},{unidades:1,dimensiones:'200 × 300',marca:'MARCA-QA-B'}]}]};
 const markup=glassLocationDetailMarkup(source);
 document.querySelector('#glassDetailTitle').innerHTML=markup.title;document.querySelector('#glassDetailMeta').innerHTML=markup.meta;document.querySelector('#glassDetailBody').innerHTML=markup.body;glassModal.hidden=false;
};
document.querySelector('#closeGlassDetail').onclick=()=>{glassModal.hidden=true;};
window.workspace=mountAssemblyWorkspace({host,bridge,noteRows:{paintOrderNoteRows,retainOrderNoteRows},isCurrent:()=>true,onClose:()=>renderAssemblyClose({host,data,context,onBack:()=>workspace.update(data,context),onReports:()=>showReports()}),onReports:()=>showReports(),onGlass:showGlass});
window.showReports=()=>{host.hidden=true;reports.hidden=false;renderAssemblyReports({host:reports,data,context});};window.refresh=()=>workspace.update(structuredClone(data),context);workspace.update(data,context);
window.showPlanReport=async()=>{const f=await fetch('/tests/fixtures/lp01-closure-plan-v4-synthetic.json').then(r=>r.json());host.hidden=true;reports.hidden=false;renderAssemblyReports({host:reports,data:f.readback,context:f.context});};
window.showPacking=()=>{
 workspace.clear();host.hidden=false;reports.hidden=true;context.stage='EMPAQUE';data.catalog.stage='EMPAQUE';data.reports=[];data.history=[];data.turn={estado:'ABIERTO',revision:0};
 for(const p of data.catalog.productions)p.oficial.saldo_empaque=p.key==='A|PANELES_2'?5:20;
 const b=data.catalog.productions.find(p=>p.key==='B|PANELES_2');
 data.orders=[{key:b.key,parte:'packing-root',oficial:b.oficial,linea:context.line,etapa:'EMPAQUE',fecha:context.date,turno:context.shift,prioridad:1,programada:999,ejecutado:999}];
 workspace.update(data,context);
};
</script></body></html>
