<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/src/modules/lp01-followup.css"><title>Seguimiento · prueba aislada</title><body><p>QA · DATOS SINTÉTICOS · SIN CONEXIÓN PRODUCTIVA</p><section id="tracking" class="lp-followup"><div class="lp-followup-heading"><h3>Seguimiento de órdenes</h3></div><div class="lp-followup-filters"><label>Línea<select data-line><option>PANELES_2</option><option>FRAMES_2</option></select></label><label>Buscar<input data-search></label><label><input data-week></label><label><input data-day></label><label><input data-shift></label><label><input data-progress></label><label><input data-sort></label></div><div data-status></div><div data-list></div><div data-summary></div></section><section id="operation" hidden><div data-operation-detail></div></section>
<div class="production-line-tabs"><button id="productionAssemblyTab">Ensamble</button><button id="productionPackingTab">Empaque</button></div><section id="productionAssemblyPanel"><div id="assemblySheetPanel"><nav><button id="assemblySheetTab">Hoja</button><button id="assemblyLocationReportTab">Ubicaciones</button></nav></div><div id="assemblyLocationReportPanel"></div></section><section id="productionPackingPanel"></section>
<script src="/production-line-tabs.js"></script>
<script type="module">
import {mountOperation} from '/src/modules/lp01-operation.js';
document.querySelector('#productionTrackingPanel').append(document.querySelector('#tracking'));document.querySelector('#productionOperationPanel').append(document.querySelector('#operation'));
window.qaToken='COORDINADOR';
window.controller=mountOperation({tracking:document.querySelector('#tracking'),operation:document.querySelector('#operation'),bridge:{getToken:()=>qaToken,getClient:async()=>({rpc:async(name,args)=>{const r=await fetch('/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(args)});return r.json();}})}});
document.dispatchEvent(new CustomEvent('sgp:lp-role',{detail:'COORDINADOR'}));document.querySelector('#productionTrackingTab').click();
</script></body></html>
