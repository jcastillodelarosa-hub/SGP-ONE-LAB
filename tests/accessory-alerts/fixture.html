<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../production-line-visual-v327.css"><link rel="stylesheet" href="../../src/modules/lp01-assembly-sheet.css"><title>QA aislada · Alertas por accesorio</title><style>body{display:block;margin:0;padding:16px;min-width:0;background:#f4f7fb}main{max-width:1300px;margin:auto}section{margin:16px 0;min-width:0}#config{background:white;padding:16px;border-radius:12px}h1{font-size:22px}button{cursor:pointer}.qa-nav{display:flex;gap:8px;flex-wrap:wrap}.qa-panel[hidden]{display:none!important}</style>
<main><h1>Alertas por accesorio · QA aislada</h1><p>Datos sintéticos · sin conexión a producción</p><nav class="qa-nav"><button data-qa="config">Configuración</button><button data-qa="assembly">Ensamble</button><button data-qa="tracking">Seguimiento</button><button data-qa="planner">Programación</button><button id="refresh">Actualizar avisos</button></nav><section class="qa-panel" id="config"></section><section class="qa-panel" id="assembly" hidden></section><section class="qa-panel" id="tracking" hidden></section><section class="qa-panel" id="planner" hidden><select id="assemblyLine"><option>PANELES_2</option></select><button id="productionPlannerTab">Consultar programación</button><div id="productionPlannerPanel"></div></section></main>
<script type="module">
import {mountAccessoryAlertConfig,accessoryAlertsMarkup} from '../../src/modules/accessory-alerts.js';
import {assemblySheetRows} from '../../src/domain/lp01-assembly-sheet.js';
import {assemblySheetMarkup} from '../../src/modules/lp01-assembly-sheet.js';
import {globalTrackingData} from '../../src/domain/lp01-tracking-global.js';
import {renderTracking} from '../../src/modules/lp01-tracking.js';
window.token='qa';window.role='ADMINISTRADOR';window.rules=[{codigo_sap:'A',descripcion:'Accesorio sintético largo para validar ajuste en móvil',revision:0,activa:false,mensaje:null},{codigo_sap:'B',descripcion:'Segundo accesorio sintético',revision:1,activa:true,mensaje:'Revisar instalación antes de ensamble'}];window.calls=[];
const context={line:'PANELES_2',stage:'ENSAMBLE',date:'2026-11-14',shift:1};
const alerts=()=>rules.filter(r=>r.activa).map(r=>({codigo:r.codigo_sap,mensaje:r.mensaje}));
const official=()=>({key_produccion:'QA|PANELES_2',id_linea:'PANELES_2',produccion:'Orden de prueba · Accesorios',sistema:'ES-TEST',reserva_al:'R-QA',cantidad:20,saldo_ensamble:10,saldos_inicializados:true,presente_ultimo_export:true,anio:2026,semana_base:46,accessory_alerts:alerts()});
const assignment=()=>({...official(),id:'qa-plan',fecha:new Date().toLocaleDateString('en-CA'),turno:1,cantidad:20,prioridad:1,estado:'PROGRAMADA',ejecutado:0});
const client={rpc:async(name,args)=>{calls.push(name);if(name==='sgp_alertas_accesorio_catalogo')return {data:structuredClone(rules)};if(name==='sgp_alertas_accesorio_guardar'){if(role!=='ADMINISTRADOR')return {error:{message:'PERMISO_DENEGADO'}};const row=rules.find(r=>r.codigo_sap===args.p_codigo);if(row.revision!==args.p_revision)return {error:{message:'REGLA_MODIFICADA_RECARGAR'}};Object.assign(row,{mensaje:args.p_mensaje,activa:args.p_activa,revision:row.revision+1});return {data:structuredClone(row)}};if(name==='sgp_alertas_accesorio_consultar')return {data:[assignment()]};return {data:[]};}};
window.SGPAccessoryAlerts=accessoryAlertsMarkup;window.SGPPlannerBridge={getRows:()=>[official()],getToken:()=>token,getClient:async()=>client,getRole:()=>role};
window.mountConfig=()=>mountAccessoryAlertConfig({host:document.getElementById('config'),client,token,getToken:()=>window.token,canEdit:()=>role==='ADMINISTRADOR'});
window.paint=()=>{const p={key:'QA|PANELES_2',line:context.line,stage:context.stage,oficial:official(),assignments:[],operations:[],history:[],classification:'ABIERTA'};const data={contract:'LP-OPERACION-1',orders:[],reports:[],turn:{estado:'ABIERTO'},catalog:{contract:'LP-HOJA-1',...context,productions:[p]}};document.getElementById('assembly').innerHTML=assemblySheetMarkup(assemblySheetRows(data,context));renderTracking({host:document.getElementById('tracking'),data:globalTrackingData({contract:'LP-SEGUIMIENTO-1',line:context.line,stage:context.stage,role:'ADMINISTRADOR',productions:[p]},context),context,state:{},onOperate:()=>{}});};
for(const b of document.querySelectorAll('[data-qa]'))b.onclick=()=>{document.querySelectorAll('.qa-panel').forEach(p=>p.hidden=p.id!==b.dataset.qa);if(b.dataset.qa==='planner')document.getElementById('productionPlannerTab').click();};document.getElementById('refresh').onclick=()=>{paint();document.getElementById('productionPlannerTab').click();};
await mountConfig();paint();const s=document.createElement('script');s.src='../../planner-operations-v326.js';s.onload=()=>window.ready=true;document.body.append(s);
</script></html>
