<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/src/modules/lp01-followup.css"><title>Seguimiento · prueba aislada</title><body><p>QA · DATOS SINTÉTICOS · SIN CONEXIÓN PRODUCTIVA</p><section id="tracking" class="lp-followup"><div class="lp-followup-heading"><h3>Seguimiento de órdenes</h3></div><div class="lp-followup-filters"><label>Línea<select data-line><option>PANELES_2</option><option>FRAMES_2</option></select></label><label>Buscar<input data-search></label><label><input data-week></label><label><input data-day></label><label><input data-shift></label><label><input data-progress></label><label><input data-sort></label></div><div data-status></div><div data-list></div><div data-summary></div></section><section id="operation" hidden><div data-operation-detail></div></section>
<div class="production-line-tabs"><button id="productionAssemblyTab">Ensamble</button><button id="productionPackingTab">Empaque</button></div><section id="productionAssemblyPanel"><div id="assemblySheetPanel"><nav><button id="assemblySheetTab">Hoja</button><button id="assemblyLocationReportTab">Ubicaciones</button></nav></div><div id="assemblyLocationReportPanel"></div></section><section id="productionPackingPanel"></section>
<script src="/production-line-tabs.js"></script>
<script type="module">
import {mountOperation} from '/src/modules/lp01-operation.js';
document.querySelector('#productionTrackingPanel').append(document.querySelector('#tracking'));document.querySelector('#productionOperationPanel').append(document.querySelector('#operation'));
window.denied=false;window.token='qa';window.calls=0;window.inflight=0;window.maxInflight=0;window.delay=false;window.fail=false;window.version=0;
window.payload=(args)=>({contract:'LP-SEGUIMIENTO-1',role:'COORDINADOR',line:args.p_linea,stage:args.p_etapa,productions:Array.from({length:30},(_,i)=>{const key='QA'+i+'|'+args.p_linea;return {key,line:args.p_linea,stage:args.p_etapa,classification:i===0?'PENDIENTE_CONCILIACION':'ABIERTA',assignments:[{id:'P'+i,key_produccion:key}],operations:[1,2].map(turno=>({key,linea:args.p_linea,etapa:args.p_etapa,fecha:'2026-11-02',turno,parte:'P'+i,ejecutado:turno+1,sale:8})),oficial:{key_produccion:key,id_linea:args.p_linea,produccion:'Producción '+i,sistema:i%2?'A':'B',reserva_al:'R'+i,saldos_inicializados:true,presente_ultimo_export:i!==0,saldo_ensamble:i===1?window.version+10:i,saldo_empaque:i+1,semana_base:i%2?1:52,anio:i%2?2026:2025}};})});
window.controller=mountOperation({orderSaleEnabled:true,tracking:document.querySelector('#tracking'),operation:document.querySelector('#operation'),bridge:{getToken:()=>window.token,getClient:async()=>({rpc:async(name,args)=>{if(name==='sgp_lp_afectaciones_consultar_v2'){const key=args.p_key,stage=args.p_stage;if(window.delayAffect){await new Promise(resolve=>window.releaseAffect=resolve);}if(window.denied)return {error:{message:'NO_AUTORIZADO'}};const reports=key.startsWith('QA5|')?[{id:'linked',cause:'NC_AL',quantity:2,solved:0,confirmed:0,originStage:stage,originDate:'2026-11-02',originShift:1,createdBy:'QA',sources:[{id:'p0'}]}]:key.startsWith('QA1|')?['NC_AL','NC_V','TECNO','NOVEDAD'].map((cause,i)=>({id:'r'+i,cause,quantity:i+1,solved:0,confirmed:0,originStage:stage,originDate:'2026-11-02',originShift:1,createdBy:'QA',sources:[]})):[];return {data:{contract:'LP-AFFECTATIONS-2',key,line:key.split('|')[1],stage,revision:0,reports,events:[],capabilities:['READ','REPORT'],available:null,aluminumPending:{status:key.startsWith('QA4|')?'UNAUTHORIZED':'AVAILABLE',rows:(key.startsWith('QA1|')||key.startsWith('QA3|')||key.startsWith('QA5|'))?(key.startsWith('QA5|')?['PICKING']:['PICKING','PRODUCCION','LEGACY','ENSAMBLE','EMPAQUE']).map((origin,i)=>({key,id:'p'+i,readOnly:true,origin,reference:'REF '+origin,pieceQuantity:i+1,state:'PENDIENTE'})):[]}}};}if(name==='sgp_lp_afectaciones_comando_v1')return {error:{message:'TURNO_NO_ABIERTO'}};if(name==='sgp_lp_sale_orden_consultar_v1')return {data:{contract:'LP-ORDER-SALE-1',key:args.p_key,stage:args.p_stage,role:'COORDINADOR',revision:0,quantity:null,history:[],capabilities:['READ','DEFINE'],operational:false,temporalPolicy:'UNRESOLVED',source:{fingerprint:'qa',exportBalance:null,available:null}}};if(name==='sgp_lp_operacion_consultar'){if(window.delayTurn)await new Promise(resolve=>window.releaseTurn=resolve);return {data:{contract:'LP-OPERACION-1',turn:{estado:args.p_fecha==='2026-11-04'&&args.p_turno===1?'ABIERTO':'CERRADO',etapa:args.p_etapa,linea:args.p_linea,fecha:args.p_fecha,turno:args.p_turno}}};}if(name!=='sgp_lp_seguimiento_consultar')throw Error('Unexpected RPC');window.calls++;window.inflight++;window.maxInflight=Math.max(window.maxInflight,window.inflight);try{if(window.delay)await new Promise(resolve=>window.release=resolve);return window.fail?{error:{message:'QA permiso revocado'}}:{data:window.payload(args)};}finally{window.inflight--;}}})}});
document.dispatchEvent(new CustomEvent('sgp:lp-role',{detail:'COORDINADOR'}));document.querySelector('#productionTrackingTab').click();
</script></body></html>
