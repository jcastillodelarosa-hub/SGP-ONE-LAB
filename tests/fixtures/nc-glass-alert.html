window.qaSale={records:JSON.parse(sessionStorage.getItem('qaSaleRecords')||'{}'),ids:[],lost:false};window.controller=mountOperation({orderSaleEnabled:true,tracking:document.querySelector('#tracking'),operation:document.querySelector('#operation'),bridge:{getToken:()=>window.token,getClient:async()=>({rpc:async(name,args)=>{const alertResult=await window.alertRpc(name,args);if(alertResult)return alertResult;if(name==='sgp_lp_shared_order_read_v1'){if(window.delayShared)await new Promise(resolve=>window.releaseShared=resolve);if(window.denied)return {error:{code:'P0001',message:'NO_AUTORIZADO'}};const native=await window.controllerSharedNative(args);return {data:{contract:'LP-SHARED-ORDER-1',key:args.p_key,line:args.p_key.split('|')[1],stage:args.p_stage,revision:0,canReport:true,reports:[],history:[],accessories:[],legacyReports:native.map(r=>({id:r.id,causa:r.cause,ventanas:r.quantity,solucionadas:r.solved,confirmadas:r.confirmed,etapa:r.originStage,origen_fecha:r.originDate,origen_turno:r.originShift,creado_por:r.createdBy}))}};}if(name==='sgp_lp_shared_order_command_v1')return {error:{code:'P0001',message:'NO_AUTORIZADO'}};if(name==='sgp_lp_afectaciones_consultar_v2'){const key=args.p_key,stage=args.p_stage;if(window.delayAffect){await new Promise(resolve=>window.releaseAffect=resolve);}if(window.denied)return {error:{message:'NO_AUTORIZADO'}};const reports=key.startsWith('QA5|')?[{id:'linked',cause:'NC_AL',quantity:2,solved:0,confirmed:0,originStage:stage,originDate:'2026-11-02',originShift:1,createdBy:'QA',sources:[{id:'p0'}]}]:key.startsWith('QA1|')?['NC_AL','NC_V','TECNO','NOVEDAD'].map((cause,i)=>({id:'r'+i,cause,quantity:i+1,solved:0,confirmed:0,originStage:stage,originDate:'2026-11-02',originShift:1,createdBy:'QA',sources:[]})):[];return {data:{contract:'LP-AFFECTATIONS-2',key,line:key.split('|')[1],stage,revision:0,reports,events:[],capabilities:['READ','REPORT'],available:null,aluminumPending:{status:key.startsWith('QA4|')?'UNAUTHORIZED':'AVAILABLE',rows:(key.startsWith('QA1|')||key.startsWith('QA3|')||key.startsWith('QA5|'))?(key.startsWith('QA5|')?['PICKING']:['PICKING','PRODUCCION','LEGACY','ENSAMBLE','EMPAQUE']).map((origin,i)=>({key,id:'p'+i,readOnly:true,origin,reference:'REF '+origin,pieceQuantity:i+1,state:'PENDIENTE'})):[]}}};}if(name==='sgp_lp_afectaciones_comando_v1')return {error:{message:'TURNO_NO_ABIERTO'}};if(name==='sgp_lp_sale_orden_consultar_v1'){const rec=qaSale.records[args.p_key]||{revision:0,quantity:null,history:[],receipts:{}};return {data:{contract:'LP-ORDER-SALE-1',key:args.p_key,stage:args.p_stage,role:'COORDINADOR',revision:rec.revision,quantity:rec.quantity,history:rec.history,capabilities:['READ','DEFINE'],operational:false,temporalPolicy:'UNRESOLVED',source:{fingerprint:'qa',exportBalance:60,available:60}}};}if(name==='sgp_lp_sale_orden_definir_v1'){const c=args.p_cmd;qaSale.ids.push(c.id);const rec=qaSale.records[args.p_key]||{revision:0,quantity:null,history:[],receipts:{}};let receipt=rec.receipts[c.id];if(!receipt){if(c.revision!==rec.revision)return {error:{code:'P0001',message:'SALE_REVISION'}};const before=rec.quantity;rec.revision++;rec.quantity=c.quantity;rec.history.push({id:c.id,revision:rec.revision,quantity:c.quantity,observation:c.observation,before:{cantidad:before}});receipt={contract:'LP-ORDER-SALE-SAVED-1',id:c.id,key:args.p_key,stage:args.p_stage,quantity:c.quantity,revision:rec.revision,operational:false,temporalPolicy:'UNRESOLVED'};rec.receipts[c.id]=receipt;qaSale.records[args.p_key]=rec;sessionStorage.setItem('qaSaleRecords',JSON.stringify(qaSale.records));}if(qaSale.lost){qaSale.lost=false;return {error:{code:'08006',message:'QA network lost after save'}};}return {data:receipt};}if(name==='sgp_lp_operacion_consultar'){if(window.delayTurn)await new Promise(resolve=>window.releaseTurn=resolve);return {data:{contract:'LP-OPERACION-1',turn:{estado:args.p_fecha==='2026-11-04'&&args.p_turno===1?'ABIERTO':'CERRADO',etapa:args.p_etapa,linea:args.p_linea,fecha:args.p_fecha,turno:args.p_turno}}};}if(name!=='sgp_lp_seguimiento_consultar')throw Error('Unexpected RPC');window.calls++;window.inflight++;window.maxInflight=Math.max(window.maxInflight,window.inflight);try{if(window.delay)await new Promise(resolve=>window.release=resolve);return window.fail?{error:{message:'QA permiso revocado'}}:{data:window.payload(args)};}finally{window.inflight--;}}})}});
